<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <img id="menu-button" src="/assets/menu 1.png" alt="sds">
            <div class="aside">
                <div class="user-info">
                    <img id="avatar-icon" src="/assets/avatar.png" alt="ava">
                    <h3>Jane Doe</h3>
                    <a href="#">janedoe@gmail.com</a>
                </div>

                <hr class="separator-line">
                <div class="sidebar-menu">
                    <div class="menu-tasks">
                        <img class="menu-icon" src="/assets/list-todo 1.png" alt="adsd">
                        <p>My Tasks</p>
                    </div>
                    <div class="menu-tasks">
                        <img class="menu-icon" src="/assets/menu settings.png" alt="adsd">
                        <p>Settings</p>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <div class="main-container">
                <nav class="navigation">
                    <h1>My Tasks</h1>
                </nav>
                <a class="togle_theme" href="#">
                    <img id="light-mode-btn" src="/assets/sun 1.png" alt="sdfs">
                    <img id="dark-mode-btn" src="/assets/moon 1.png" alt="moon">
                </a>
               
                <div class="container">
                    <form class="search-form">
                            <input type="text" name="task-text" id="task-input" placeholder="Type your task here..." required>
                            <button type="submit" class="add-task-btn">+ Add</button>
                    </form>

                    <div class="no-tasks">
                        <img src="/assets/selfie 1.png" alt="no task">
                        <p>Empty as my motivation on Monday 😅. <br>Let’s start adding stuff!</p>
                    </div>


                    <div class="task-container hidden">
                        <div class="tasks-navigation">
                            <ul class="todo-list">
                                <li id="all">All |</li>
                                <li id="active">Active |</li>
                                <li id="completed">Completed</li>
                            </ul>
                            <span class="tasks-left"></span>
                        </div>
                        <div id="tasks-wrapper"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
<script src="script.js"></script>
</html>
