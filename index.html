<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <input type=""><img src="/assets/menu 1.png" alt="sds">
            <div class="aside">
                <div class="user-info">
                    <img src="/assets/avatar.png" alt="ava">
                    <h3>Jane Doe</h3>
                    <a href="#">janedoe@gmail.com</a>
                </div>

                <hr class="separator-line">
                <div class="menu-tasks">
                    <div class="tasks">
                        <img src="/assets/list-todo 1.png" alt="adsd">
                        <p>My Tasks</p>
                    </div>
                    <div class="tasks">
                        <img src="/assets/menu settings.png" alt="adsd">
                        <p>Settings</p>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main-content">
            <nav class="navigation">
                <h1>My Tasks</h1>
            </nav>
            <a class="togle_theme" href="#"><img src="/assets/moon 1.png" alt="moon"></a>
            <div class="container">
                <form class="search-form">
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            name="task-text" 
                            id="task-input" 
                            placeholder="Type your task here..." 
                            required
                        >
                    </div>
                    <button type="submit" class="add-task-btn">+ Add</button>
                </form>
                <div class="no-tasks">
                    <img src="/assets/selfie 1.png" alt="no task">
                    <p>Empty as my motivation on Monday 😅. Let’s start adding stuff!</p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
